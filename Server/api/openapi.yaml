# Generated language bindings use this file as their source of truth.
openapi: "3.1.0"
info:
  title: "SottoDuo API"
  version: "2.0.0"
  description: "Shared transport contract for the Swift client and TypeScript server. Optional properties are omitted rather than encoded as null. Dates use whole-second ISO8601 UTC timestamps."
servers:
  -
    url: "http://localhost:8391"
security:
  -
    bearerAuth: []
x-sottoduo-apiVersion: 3
x-sottoduo-recordingProtocol: "sottoduo.recording.v1"
x-sottoduo-defaultPort: 8391
x-sottoduo-maximumRecordingSeconds: 180
x-sottoduo-maximumChunkBytes: 1048576
x-sottoduo-maximumArtifactBytes: 8388608
x-sottoduo-maximumDictionaryBytes: 8388608
paths:
  /v1/button-destinations:
    get:
      operationId: getButtonDestinations
      parameters: []
      responses:
        "200":
          description: Live button-destination state. Selection and commands never survive
            expiry or restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ButtonDestinationState"
        default:
          $ref: "#/components/responses/APIError"
    post:
      operationId: registerButtonDestination
      parameters:
        - &a1
          name: X-SottoDuo-Destination-Owner
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
          description: Fresh 256-bit secret for this in-memory destination registration.
            Never persist or log it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterButtonDestination"
      responses:
        "200":
          description: Live button-destination state. Selection and commands never survive
            expiry or restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ButtonDestinationState"
        default:
          $ref: "#/components/responses/APIError"
  /v1/button-destinations/{id}/heartbeat:
    post:
      operationId: heartbeatButtonDestination
      parameters:
        - &a2
          name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatButtonDestination"
      responses:
        "200":
          description: Live button-destination state. Selection and commands never survive
            expiry or restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ButtonDestinationState"
        default:
          $ref: "#/components/responses/APIError"
  /v1/button-destinations/{id}/select:
    post:
      operationId: selectButtonDestination
      parameters:
        - *a2
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectButtonDestination"
      responses:
        "200":
          description: Live button-destination state. Selection and commands never survive
            expiry or restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ButtonDestinationState"
        default:
          $ref: "#/components/responses/APIError"
  /v1/button-destinations/{id}/complete:
    post:
      operationId: completeButtonTake
      parameters:
        - *a2
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteButtonTake"
      responses:
        "200":
          description: Live button-destination state. Selection and commands never survive
            expiry or restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ButtonDestinationState"
        default:
          $ref: "#/components/responses/APIError"
  /v1/button-destinations/{id}:
    delete:
      operationId: unregisterButtonDestination
      parameters:
        - *a2
        - *a1
      responses:
        "200":
          description: Live button-destination state. Selection and commands never survive
            expiry or restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ButtonDestinationState"
        default:
          $ref: "#/components/responses/APIError"
  "/v1/audio-sources":
    get:
      operationId: "listAudioSources"
      responses:
        "200":
          description: "Bounded snapshot; discovery never starts audio or connects Bluetooth.
            Other computers only see shared sources."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AudioSourceList"
        default:
          "$ref": "#/components/responses/APIError"
  "/v1/audio-sources/sharing":
    put:
      operationId: "setAudioSourceSharing"
      description: "Shares or stops sharing one source with other computers. Only a client on
        the computer that hosts the sources may change this."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AudioSourceSharing"
      responses:
        "200":
          description: "Updated snapshot."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AudioSourceList"
        default:
          "$ref": "#/components/responses/APIError"
  /v1/button-destinations/target:
    put:
      operationId: setButtonTarget
      description: Chooses where the DJI button types. Stored on the server and shared by
        every destination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ButtonTarget"
      responses:
        "200":
          description: Live button-destination state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ButtonDestinationState"
        default:
          $ref: "#/components/responses/APIError"
  "/v2/captures":
    post:
      operationId: "startCapture"
      parameters:
        - "$ref": "#/components/parameters/CaptureOwner"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/StartCaptureRequest"
      responses:
        "201":
          description: "Admitted recording session with acknowledged microphone readiness."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RecordingSnapshot"
        default:
          "$ref": "#/components/responses/APIError"
  "/v2/recordings/{id}/capture/heartbeat":
    post:
      operationId: "heartbeatCapture"
      parameters:
        - "$ref": "#/components/parameters/CaptureOwner"
        - name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
      responses:
        "204":
          description: "Owner lease renewed. Send every second; expiry is six seconds."
        default:
          "$ref": "#/components/responses/APIError"
  "/v2/recordings/{id}/capture/stop":
    post:
      operationId: "stopCapture"
      parameters:
        - "$ref": "#/components/parameters/CaptureOwner"
        - name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/StopCaptureRequest"
      responses:
        "202":
          description: "Capture stopped and its run sealed; processing continues to completion."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RecordingSnapshot"
        default:
          "$ref": "#/components/responses/APIError"
  "/v2/recordings/{id}/context":
    post:
      operationId: "setCaptureContext"
      description: "Fix a remote capture's continuation (or none) before its text processing starts."
      parameters:
        - "$ref": "#/components/parameters/CaptureOwner"
        - name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/StopCaptureRequest"
      responses:
        "200":
          description: "Continuation fixed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RecordingSnapshot"
        default:
          "$ref": "#/components/responses/APIError"
  "/v2/recordings/{id}/events":
    get:
      operationId: "recordingEvents"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
      responses:
        "200":
          description: "NDJSON RecordingSnapshot lines until the session completes, fails, or is discarded."
          content:
            "application/x-ndjson":
              schema:
                type: string
        default:
          "$ref": "#/components/responses/APIError"
  "/v1/health":
    get:
      operationId: "getHealth"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ServerHealth"
        default:
          "$ref": "#/components/responses/APIError"
      security: []
  "/v1/preferences":
    get:
      operationId: "getPreferences"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PreferencesSnapshot"
        default:
          "$ref": "#/components/responses/APIError"
    put:
      operationId: "updatePreferences"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PreferencesSnapshot"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PreferencesSnapshot"
        x-maximumBytes: 262144
  "/v1/generations":
    get:
      operationId: "listGenerations"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationPage"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        - "$ref": "#/components/parameters/CaptureView"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 50
        -
          name: "before"
          in: "query"
          required: false
          schema:
            type: "string"
        -
          name: "source"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "sottoduo"
              - "wispr-flow"
    post:
      operationId: "createGeneration"
      responses:
        "201":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateGenerationRequest"
        x-maximumBytes: 262144
  "/v1/generations/{id}":
    get:
      operationId: "getGeneration"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        - "$ref": "#/components/parameters/CaptureView"
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
    delete:
      operationId: "deleteGeneration"
      responses:
        "204":
          description: "Success"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/audio/{kind}":
    post:
      operationId: "appendAudio"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AudioChunkReceipt"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
        -
          name: "kind"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/AudioKind"
        -
          name: "sequence"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 0
            maximum: 4095
        -
          name: "sampleRate"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 8000
            maximum: 192000
        -
          name: "channels"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 8
      requestBody:
        required: true
        content:
          "application/octet-stream":
            schema:
              type: "string"
              format: "binary"
        description: "Raw interleaved little-endian float32 PCM. Chunks must contain whole frames. Repeated sequences must have identical bytes."
        x-maximumBytes: 1048576
  "/v1/generations/{id}/finish":
    post:
      operationId: "finishGeneration"
      responses:
        "202":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FinishGenerationRequest"
        x-maximumBytes: 262144
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/cancel":
    post:
      operationId: "cancelGeneration"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        - "$ref": "#/components/parameters/CaptureView"
        - "$ref": "#/components/parameters/CaptureMutationOwner"
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/retry":
    post:
      operationId: "retryGeneration"
      responses:
        "202":
          description: "Accepted"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        - "$ref": "#/components/parameters/CaptureView"
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/delivery":
    post:
      operationId: "recordDelivery"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DeliveryReceipt"
        x-maximumBytes: 262144
      parameters:
        - "$ref": "#/components/parameters/CaptureView"
        - "$ref": "#/components/parameters/CaptureMutationOwner"
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/events":
    get:
      operationId: "generationEvents"
      responses:
        "200":
          description: "Success"
          content:
            "application/x-ndjson":
              schema:
                type: "string"
              x-recordSchema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      description: "A bounded NDJSON stream of complete GenerationRecord values, with the latest record repeated as a two-second heartbeat. Ends after a terminal record."
      parameters:
        - "$ref": "#/components/parameters/CaptureView"
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/artifacts/{filename}":
    get:
      operationId: "downloadArtifact"
      responses:
        "200":
          description: "Success"
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
            "audio/wav":
              schema:
                type: "string"
                format: "binary"
            "image/png":
              schema:
                type: "string"
                format: "binary"
            "application/json":
              schema:
                type: "string"
                format: "binary"
            "text/plain":
              schema:
                type: "string"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
        -
          name: "filename"
          in: "path"
          required: true
          schema:
            type: "string"
            enum:
              - "inference.wav"
              - "original.wav"
              - "metadata.json"
              - "transcript.txt"
              - "source.json"
              - "source.wav"
              - "opus.json"
              - "screenshot.png"
              - "built-in-audio.bin"
  "/v1/imports/wispr-flow/known":
    post:
      operationId: "knownWisprFlowIDs"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowKnownIDsResponse"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/WisprFlowKnownIDsRequest"
        x-maximumBytes: 262144
  "/v1/imports/wispr-flow":
    post:
      operationId: "beginWisprFlowImport"
      responses:
        "201":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowImportSession"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/WisprFlowImportRequest"
        x-maximumBytes: 262144
  "/v1/imports/wispr-flow/dictionary":
    put:
      operationId: "archiveWisprFlowDictionary"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowDictionaryArchiveReceipt"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {}
        x-maximumBytes: 8388608
        description: "Original Wispr Flow dictionary JSON archive. This does not change the active personal dictionary."
  "/v1/imports/wispr-flow/{id}/artifacts/{filename}":
    put:
      operationId: "uploadWisprFlowArtifact"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowArtifactReceipt"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
        -
          name: "filename"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/WisprFlowArtifactName"
      requestBody:
        required: true
        content:
          "application/octet-stream":
            schema:
              type: "string"
              format: "binary"
          "application/json":
            schema:
              type: "string"
              format: "binary"
          "audio/wav":
            schema:
              type: "string"
              format: "binary"
          "image/png":
            schema:
              type: "string"
              format: "binary"
        x-maximumBytes: 8388608
  "/v1/imports/wispr-flow/{id}/complete":
    post:
      operationId: "completeWisprFlowImport"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowImportResult"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/imports/wispr-flow/{id}":
    delete:
      operationId: "cancelWisprFlowImport"
      responses:
        "204":
          description: "Success"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  /v2/recordings/capabilities:
    get:
      operationId: getRecordingCapabilities
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingCapabilities"
        default:
          $ref: "#/components/responses/APIError"
  /v2/recordings:
    post:
      operationId: createRecording
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSnapshot"
        default:
          $ref: "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGenerationRequest"
    get:
      operationId: listRecordings
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPage"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
  /v2/recordings/{id}:
    get:
      operationId: getRecording
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDetail"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /v2/recordings/{id}/transcript:
    get:
      operationId: getRecordingTranscript
      responses:
        "200":
          description: Success
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /v2/recordings/{id}/audio/{kind}:
    get:
      operationId: getRecordingAudio
      responses:
        "200":
          description: Success
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AudioKind"
  /v2/recordings/{id}/discard:
    post:
      operationId: discardRecording
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSnapshot"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - "$ref": "#/components/parameters/CaptureMutationOwner"
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /v2/recordings/{id}/retry:
    post:
      operationId: retryRecording
      description: Resume a failed recording's processing from its committed text with local recognition. Nothing is delivered.
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSnapshot"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /v2/recordings/{id}/delivery:
    post:
      operationId: recordRecordingDelivery
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRecord"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - "$ref": "#/components/parameters/CaptureMutationOwner"
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryReceipt"
  /v2/recordings/{id}/stream:
    get:
      operationId: streamRecording
      description: Upgrade to WebSocket subprotocol sottoduo.recording.v1. Binary audio is UInt32BE JSON
        header length, UTF8 RecordingAudioHeader, then little-endian float32 PCM. Text controls
        resume, context, pause, stop and ping; server sends snapshots, acknowledgments, progress and
        errors. See docs/recording-protocol.md for durable ACK, fencing and resume semantics.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "101":
          description: WebSocket upgrade
        default:
          $ref: "#/components/responses/APIError"
  /v2/recordings/{id}/audio/{kind}/{runID}:
    get:
      operationId: getRecordingRunAudio
      responses:
        "200":
          description: Success
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AudioKind"
        - name: runID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
components:
  schemas:
    UUID:
      type: "string"
      format: "uuid"
    GenerationMode:
      type: "string"
      enum:
        - "dictation"
        - "test"
        - "file"
    GenerationStatus:
      type: "string"
      enum:
        - "receiving"
        - "queued"
        - "transcribing"
        - "proofreading"
        - "completed"
        - "failed"
        - "cancelled"
    AudioKind:
      type: "string"
      enum:
        - "inference"
        - "original"
    WisprFlowArtifactName:
      type: "string"
      enum:
        - "source.json"
        - "source.wav"
        - "opus.json"
        - "screenshot.png"
        - "built-in-audio.bin"
    WisprFlowImportOutcome:
      type: "string"
      enum:
        - "imported"
        - "enriched"
        - "skipped"
        - "partial"
    TextProcessingStatus:
      type: "string"
      enum:
        - "disabled"
        - "unavailable"
        - "applied"
        - "unchanged"
        - "rejected"
        - "failed"
        - "skipped"
    SpokenListStyle:
      type: "string"
      enum:
        - "numbered"
        - "bulleted"
    DictationBoundary:
      type: "string"
      enum:
        - "none"
        - "line"
        - "paragraph"
    DictionaryEntry:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 128
        term:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 128
        aliases:
          type: "array"
          items:
            type: "string"
            minLength: 1
            x-maximumGraphemes: 128
          maxItems: 8
          default: []
        isPriority:
          type: "boolean"
          default: false
      required:
        - "id"
        - "term"
    DictionaryList:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 128
        name:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 80
        entries:
          type: "array"
          items:
            "$ref": "#/components/schemas/DictionaryEntry"
          maxItems: 500
          default: []
      required:
        - "id"
        - "name"
    PersonalDictionary:
      type: "object"
      additionalProperties: false
      properties:
        lists:
          type: "array"
          items:
            "$ref": "#/components/schemas/DictionaryList"
          maxItems: 32
      required:
        - "lists"
    DeviceIdentity:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
        name:
          type: "string"
      required:
        - "id"
        - "name"
    RecognitionMode:
      type: "string"
      enum: ["automatic", "cloud", "local"]
    RecognitionEngine:
      type: "string"
      description: "The local speech model. Whisper large-v3-turbo covers Whisper's languages and uses vocabulary hints; Parakeet TDT 0.6B v3 is faster, detects 25 European languages itself, and ignores vocabulary hints."
      enum: ["whisper", "parakeet"]
    RecognitionState:
      type: "object"
      additionalProperties: false
      properties:
        provider:
          type: "string"
          description: "whisper means local server recognition, whichever recognition engine is selected."
          enum: ["soniox", "whisper"]
        fallbackReason:
          type: "string"
        partialText:
          type: "string"
      required: ["provider"]
    ServerPreferences:
      type: "object"
      additionalProperties: false
      properties:
        recognitionMode:
          "$ref": "#/components/schemas/RecognitionMode"
        recognitionEngine:
          "$ref": "#/components/schemas/RecognitionEngine"
          description: "Request this field with X-SottoDuo-Recognition-Engine: engine-v1. Missing values select Whisper; updates that omit it keep the server's selection."
        language:
          type: "string"
          description: "Norwegian (no) is sent only to clients that send X-SottoDuo-Language: language-v2; others see auto, and saving auto keeps Norwegian."
          enum:
            - "en"
            - "auto"
            - "es"
            - "fr"
            - "de"
            - "it"
            - "pt"
            - "nl"
            - "ja"
            - "zh"
            - "ko"
            - "hi"
            - "ar"
            - "pl"
            - "ru"
            - "uk"
            - "sv"
            - "no"
        proofreadingPrompt:
          type: "string"
          minLength: 1
          description: "Missing values use the built-in cleanup prompt; maximum UTF-8 size is 4096 bytes."
        vocabulary:
          type: "string"
          description: "Maximum UTF-8 size is 16384 bytes."
        dictionary:
          "$ref": "#/components/schemas/PersonalDictionary"
        textCorrectionEnabled:
          type: "boolean"
        keepOriginalAudio:
          type: "boolean"
      required:
        - "language"
        - "vocabulary"
        - "dictionary"
        - "textCorrectionEnabled"
        - "keepOriginalAudio"
    PreferencesSnapshot:
      type: "object"
      additionalProperties: false
      properties:
        revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        preferences:
          "$ref": "#/components/schemas/ServerPreferences"
      required:
        - "revision"
        - "preferences"
    ModelRuntimeInfo:
      type: "object"
      additionalProperties: false
      properties:
        modelID:
          type: "string"
        backend:
          type: "string"
        ready:
          type: "boolean"
        message:
          type: "string"
      required:
        - "modelID"
        - "backend"
        - "ready"
    ServerHealth:
      type: "object"
      additionalProperties: false
      properties:
        apiVersion:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        serverVersion:
          type: "string"
        isDev:
          type: "boolean"
        ready:
          type: "boolean"
        generationRetry:
          type: "boolean"
          description: "Whether failed or cancelled generations with sealed audio can be retried. Request this field with X-SottoDuo-Generation-Retry: retry-v1. An omitted value means unsupported."
        cloudRecognition:
          type: "boolean"
          description: "Whether cloud recognition (Soniox) is configured on this server. Request this field with X-SottoDuo-Cloud-Recognition: cloud-v1. An omitted value means unknown."
        features:
          type: "array"
          description: "Additions to API version 3 this server supports, such as retry-completed (finished takes can be transcribed again) and language-no (Norwegian). Request this field with X-SottoDuo-Features: features-v1. An omitted value means none."
          items:
            type: "string"
            maxLength: 64
          maxItems: 32
        recognitionEngines:
          type: "array"
          description: "Local recognition engines installed on this server. Request this field with X-SottoDuo-Recognition-Engine: engine-v1. An omitted value means Whisper only."
          items:
            "$ref": "#/components/schemas/RecognitionEngine"
        speech:
          "$ref": "#/components/schemas/ModelRuntimeInfo"
        proofreading:
          "$ref": "#/components/schemas/ModelRuntimeInfo"
        message:
          type: "string"
      required:
        - "apiVersion"
        - "serverVersion"
        - "isDev"
        - "ready"
        - "speech"
        - "proofreading"
    ButtonDestination:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        device:
          $ref: "#/components/schemas/DeviceIdentity"
      required:
        - id
        - device
    RegisterButtonDestination:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        device:
          $ref: "#/components/schemas/DeviceIdentity"
      required:
        - id
        - device
    ButtonCommand:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        takeID:
          $ref: "#/components/schemas/UUID"
        action:
          type: string
          enum:
            - start
            - stop
            - cancel
        source:
          $ref: "#/components/schemas/AudioSourceIdentity"
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - takeID
        - action
        - source
        - expiresAt
    ButtonDestinationState:
      type: object
      additionalProperties: false
      properties:
        selected:
          $ref: "#/components/schemas/ButtonDestination"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/ButtonDestination"
          maxItems: 8
        source:
          $ref: "#/components/schemas/AudioSourceIdentity"
        available:
          type: boolean
        command:
          $ref: "#/components/schemas/ButtonCommand"
        buttonTarget:
          $ref: "#/components/schemas/ButtonTarget"
      required:
        - destinations
        - available
    ButtonTarget:
      type: object
      additionalProperties: false
      description: lastDictated follows the computer of the latest successful shortcut
        dictation; device always types into one computer; off ignores the button.
      properties:
        mode:
          type: string
          enum:
            - lastDictated
            - device
            - "off"
        device:
          $ref: "#/components/schemas/DeviceIdentity"
      required:
        - mode
    HeartbeatButtonDestination:
      type: object
      additionalProperties: false
      properties:
        acknowledgement:
          $ref: "#/components/schemas/UUID"
      required: []
    SelectButtonDestination:
      type: object
      additionalProperties: false
      properties:
        generationID:
          $ref: "#/components/schemas/UUID"
      required: []
    CompleteButtonTake:
      type: object
      additionalProperties: false
      properties:
        takeID:
          $ref: "#/components/schemas/UUID"
      required:
        - takeID
    AudioSourceIdentity:
      type: "object"
      additionalProperties: false
      properties:
        hostID:
          type: "string"
          minLength: 1
          maxLength: 128
        id:
          type: "string"
          minLength: 1
          maxLength: 256
      required: [hostID, id]
    AudioSource:
      type: "object"
      additionalProperties: false
      properties:
        identity:
          "$ref": "#/components/schemas/AudioSourceIdentity"
        name:
          type: "string"
          minLength: 1
          maxLength: 128
        transport:
          type: "string"
          enum: [usb, bluetooth, builtIn, other]
        present:
          type: "boolean"
        link:
          type: "string"
          enum: [connected, disconnected, unknown, notApplicable]
        capture:
          type: "string"
          enum: [available, unavailable, unknown]
        audioHealth:
          type: "string"
          enum: [unknown, healthy, degraded]
        observedAt:
          type: "string"
          format: "date-time"
        reason:
          type: "string"
          maxLength: 512
        shared:
          type: "boolean"
          description: "Other computers may record from this source."
        recordingFor:
          "$ref": "#/components/schemas/DeviceIdentity"
          description: "The device whose take this computer is recording. One take holds every
            source until it ends."
      required: [identity, name, transport, present, link, capture, audioHealth, observedAt]
    AudioSourceList:
      type: "object"
      additionalProperties: false
      properties:
        sources:
          type: "array"
          maxItems: 32
          items:
            "$ref": "#/components/schemas/AudioSource"
        sharingHost:
          "$ref": "#/components/schemas/SharingHost"
      required: [sources]
    SharingHost:
      type: "object"
      additionalProperties: false
      description: "The computer whose sources are listed."
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 128
        local:
          type: "boolean"
          description: "The request came from that computer, so it may change sharing."
      required: [name, local]
    AudioSourceSharing:
      type: "object"
      additionalProperties: false
      properties:
        source:
          "$ref": "#/components/schemas/AudioSourceIdentity"
        shared:
          type: "boolean"
      required: [source, shared]
    RemoteCapture:
      type: "object"
      additionalProperties: false
      properties:
        continuationID:
          "$ref": "#/components/schemas/UUID"
        source:
          "$ref": "#/components/schemas/AudioSourceIdentity"
        state:
          type: "string"
          enum: [preparing, recording, stopping, sealed, stopped]
        peak:
          type: "number"
          minimum: 0
          maximum: 1
      required: [source, state]
    StartCaptureRequest:
      type: "object"
      additionalProperties: false
      properties:
        buttonTicket:
          "$ref": "#/components/schemas/UUID"
        requestID:
          "$ref": "#/components/schemas/UUID"
        device:
          "$ref": "#/components/schemas/DeviceIdentity"
        mode:
          type: "string"
          enum: [dictation, test]
        source:
          "$ref": "#/components/schemas/AudioSourceIdentity"
      required: [requestID, device, mode, source]
    StopCaptureRequest:
      type: "object"
      additionalProperties: false
      properties:
        continuationID:
          "$ref": "#/components/schemas/UUID"
    CreateGenerationRequest:
      type: "object"
      additionalProperties: false
      properties:
        requestID:
          "$ref": "#/components/schemas/UUID"
        device:
          "$ref": "#/components/schemas/DeviceIdentity"
        mode:
          "$ref": "#/components/schemas/GenerationMode"
      required:
        - "requestID"
        - "device"
        - "mode"
    AudioStreamFormat:
      type: "object"
      additionalProperties: false
      properties:
        sampleRate:
          type: "integer"
          minimum: 8000
          maximum: 192000
        channels:
          type: "integer"
          minimum: 1
          maximum: 8
      required:
        - "sampleRate"
        - "channels"
    AudioChunkReceipt:
      type: "object"
      additionalProperties: false
      properties:
        nextSequence:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        frameCount:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
      required:
        - "nextSequence"
        - "frameCount"
    FinishGenerationRequest:
      type: "object"
      additionalProperties: false
      properties:
        inferenceFrames:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        originalFrames:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        continuationID:
          "$ref": "#/components/schemas/UUID"
      required:
        - "inferenceFrames"
    AudioArtifact:
      type: "object"
      additionalProperties: false
      properties:
        filename:
          type: "string"
        sampleRate:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        channels:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        frameCount:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        byteCount:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        encoding:
          type: "string"
      required:
        - "filename"
        - "sampleRate"
        - "channels"
        - "frameCount"
        - "byteCount"
        - "encoding"
    ModelProvenance:
      type: "object"
      additionalProperties: false
      properties:
        modelID:
          type: "string"
        modelSHA256:
          type: "string"
        backend:
          type: "string"
        engineVersion:
          type: "string"
        processingSeconds:
          type: "number"
          minimum: 0
      required:
        - "modelID"
        - "backend"
    DeliveryReceipt:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "string"
        message:
          type: "string"
        reportedAt:
          type: "string"
          format: "date-time"
      required:
        - "status"
        - "reportedAt"
    ModelHintUsage:
      type: "object"
      additionalProperties: false
      properties:
        includedTerms:
          type: "array"
          items:
            type: "string"
        omittedTerms:
          type: "array"
          items:
            type: "string"
        tokenCount:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        tokenBudget:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "includedTerms"
        - "omittedTerms"
    SpokenListContext:
      type: "object"
      additionalProperties: false
      properties:
        style:
          "$ref": "#/components/schemas/SpokenListStyle"
        nextNumber:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "style"
        - "nextNumber"
    ListControlSpan:
      type: "object"
      additionalProperties: false
      properties:
        location:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        length:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "location"
        - "length"
    TextRepairSpan:
      type: "object"
      additionalProperties: false
      properties:
        locationUTF16:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        lengthUTF16:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        text:
          type: "string"
      required:
        - "locationUTF16"
        - "lengthUTF16"
        - "text"
    VerifiedTextRepair:
      type: "object"
      additionalProperties: false
      properties:
        abandoned:
          "$ref": "#/components/schemas/TextRepairSpan"
        cue:
          "$ref": "#/components/schemas/TextRepairSpan"
        replacement:
          "$ref": "#/components/schemas/TextRepairSpan"
      required:
        - "abandoned"
        - "cue"
        - "replacement"
    TextProcessingRecord:
      type: "object"
      additionalProperties: false
      properties:
        dictionaryTerms:
          type: "array"
          items:
            type: "string"
        dictionaryChangedText:
          type: "boolean"
        inputText:
          type: "string"
        outputText:
          type: "string"
        enabled:
          type: "boolean"
        status:
          "$ref": "#/components/schemas/TextProcessingStatus"
        reason:
          type: "string"
        modelID:
          type: "string"
        modelSHA256:
          type: "string"
        engineVersion:
          type: "string"
        processingSeconds:
          type: "number"
          minimum: 0
        wallSeconds:
          type: "number"
          minimum: 0
        proposedText:
          type: "string"
        verifiedRepairs:
          type: "array"
          items:
            "$ref": "#/components/schemas/VerifiedTextRepair"
          maxItems: 8
      required:
        - "dictionaryTerms"
        - "dictionaryChangedText"
        - "inputText"
        - "outputText"
        - "enabled"
        - "status"
    DictationContinuation:
      type: "object"
      additionalProperties: false
      properties:
        list:
          "$ref": "#/components/schemas/SpokenListContext"
        preview:
          type: "string"
        boundary:
          "$ref": "#/components/schemas/DictationBoundary"
      required:
        - "preview"
        - "boundary"
    WisprFlowArtifactManifest:
      type: "object"
      additionalProperties: false
      properties:
        filename:
          "$ref": "#/components/schemas/WisprFlowArtifactName"
        byteCount:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        sha256:
          type: "string"
          pattern: "^[a-fA-F0-9]{64}$"
      required:
        - "filename"
        - "byteCount"
        - "sha256"
    WisprFlowImportRequest:
      type: "object"
      additionalProperties: false
      properties:
        sourceID:
          "$ref": "#/components/schemas/UUID"
        createdAt:
          type: "string"
          format: "date-time"
        sourceStatus:
          type: "string"
        finalText:
          type: "string"
        rawText:
          type: "string"
        durationSeconds:
          type: "number"
          minimum: 0
        variantNames:
          type: "array"
          items:
            type: "string"
          maxItems: 32
        artifacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/WisprFlowArtifactManifest"
          minItems: 1
          maxItems: 4
        unarchivedArtifacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/WisprFlowArtifactManifest"
      required:
        - "sourceID"
        - "createdAt"
        - "finalText"
        - "rawText"
        - "variantNames"
        - "artifacts"
    WisprFlowImportSession:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
      required:
        - "id"
    WisprFlowArtifactReceipt:
      type: "object"
      additionalProperties: false
      properties:
        filename:
          "$ref": "#/components/schemas/WisprFlowArtifactName"
        byteCount:
          type: "integer"
          minimum: 0
          maximum: 8388608
      required:
        - "filename"
        - "byteCount"
    WisprFlowKnownIDsRequest:
      type: "object"
      additionalProperties: false
      properties:
        sourceIDs:
          type: "array"
          items:
            "$ref": "#/components/schemas/UUID"
          maxItems: 10000
      required:
        - "sourceIDs"
    WisprFlowKnownIDsResponse:
      type: "object"
      additionalProperties: false
      properties:
        knownSourceIDs:
          type: "array"
          items:
            "$ref": "#/components/schemas/UUID"
      required:
        - "knownSourceIDs"
    WisprFlowDictionaryArchiveReceipt:
      type: "object"
      additionalProperties: false
      properties:
        byteCount:
          type: "integer"
          minimum: 0
          maximum: 8388608
        sha256:
          type: "string"
      required:
        - "byteCount"
        - "sha256"
    ImportedSource:
      type: "object"
      additionalProperties: false
      properties:
        provider:
          type: "string"
        sourceID:
          "$ref": "#/components/schemas/UUID"
        sourceStatus:
          type: "string"
        importedAt:
          type: "string"
          format: "date-time"
        variantNames:
          type: "array"
          items:
            type: "string"
        artifactNames:
          type: "array"
          items:
            "$ref": "#/components/schemas/WisprFlowArtifactName"
        durationSeconds:
          type: "number"
          minimum: 0
        sourceSHA256:
          type: "string"
        artifactSHA256:
          type: "object"
          additionalProperties:
            type: "string"
        unarchivedArtifactSHA256:
          type: "object"
          additionalProperties:
            type: "string"
      required:
        - "provider"
        - "sourceID"
        - "importedAt"
        - "variantNames"
        - "artifactNames"
