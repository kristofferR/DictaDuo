  parameters:
    CaptureView:
      name: "X-SottoDuo-Capture"
      in: "header"
      required: false
      description: "Opt in to remote capture source/state fields; omit for the legacy generation shape."
      schema:
        type: "string"
        enum: [capture-v1]
    CaptureMutationOwner:
      name: "X-SottoDuo-Capture-Owner"
      in: "header"
      required: false
      description: "Required for remote-capture cancellation and delivery; omitted by local-upload clients."
      schema:
        type: "string"
        pattern: "^[0-9a-f]{64}$"
    CaptureOwner:
      name: "X-SottoDuo-Capture-Owner"
      in: "header"
      required: true
      description: "Client-generated 256-bit lowercase hexadecimal secret, unique per capture request. Required in addition to server authorization for remote recording control and delivery. Never put it in URLs or history."
      schema:
        type: "string"
        pattern: "^[0-9a-f]{64}$"
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Optional on loopback. Required for remote binding. Native clients send no Origin header."
  responses:
    APIError:
      description: "A request, admission, or server error."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/APIErrorResponse"
