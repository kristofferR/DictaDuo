name: Server release packages

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64-cpu
          - runner: ubuntu-24.04-arm
            platform: linux-arm64-cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev \
            libpipewire-0.3-dev libusb-1.0-0-dev libsamplerate0-dev
      - name: Install the Metal compiler
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - run: bun install --frozen-lockfile
      - name: Build complete platform package
        env:
          DICTADUO_NATIVE: "OFF"
          DICTADUO_CUDA: "OFF"
          DICTADUO_BUILD_JOBS: "4"
          DICTADUO_BUILD_CAPTURE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bash scripts/build-server.sh
      - name: Import release signing certificate
        if: inputs.release && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/import-signing-keychain.sh
      - name: Verify and archive server
        env:
          PLATFORM: ${{ matrix.platform }}
          SIGNED: ${{ inputs.release && runner.os == 'macOS' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flags=()
          if [[ "$SIGNED" == true ]]; then flags+=(--signed); fi
          bash scripts/package-server.sh "$PLATFORM" "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-server-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
      - name: Remove release signing keychain
        if: always() && inputs.release && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/dictaduo-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dictaduo-signing.p12"
