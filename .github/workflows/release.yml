name: Release

on:
  push:
    tags: [v*]
  # Manual runs validate and package without signing or publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and curated draft
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version
        env:
          TAG: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            bash scripts/release-version.sh "$TAG"
            git merge-base --is-ancestor HEAD origin/main
          else
            bash scripts/release-version.sh
          fi
      - name: Require release signing secrets
        if: github.event_name == 'push'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then echo "Missing release secret: $name" >&2; exit 1; fi
          done
      - name: Require curated draft release
        id: draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          release=$(gh release view "$TAG" --json databaseId,isDraft,tagName,name,body)
          jq -e --arg tag "$TAG" '.isDraft == true and .tagName == $tag and (.name | test("\\S")) and (.body | test("\\S"))' <<< "$release" >/dev/null
          echo "release_id=$(jq -r .databaseId <<< "$release")" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/server.yml

  clients:
    needs: [prepare, checks]
    uses: ./.github/workflows/clients.yml
    with:
      release: ${{ github.event_name == 'push' }}
    secrets: inherit

  servers:
    needs: [prepare, checks]
    uses: ./.github/workflows/server-release.yml
    with:
      release: ${{ github.event_name == 'push' }}
    secrets: inherit

  publish:
    name: Verify all assets and publish
    needs: [prepare, clients, servers]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release
      - name: Check exact asset set and publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: bash scripts/publish-release.sh
